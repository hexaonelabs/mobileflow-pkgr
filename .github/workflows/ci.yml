name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check "apps/web/src/**/*.{ts,html,css}"
      - run: npm run web:test -- --run
      - run: npm run web:build

  api:
    name: api (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint "src/**/*.ts" "test/**/*.ts"
        working-directory: apps/api
      - run: npm run api:test
      - run: npm run api:build
