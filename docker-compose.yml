services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      # Le service Redis s'appelle "redis" sur le réseau Docker interne,
      # override la valeur localhost du .env qui ne fonctionne pas entre containers.
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
